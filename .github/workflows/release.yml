# GitHub で Release を公開すると、CI と同じ検査を通したうえで PyPI に公開する。
# PyPI へは Trusted Publishing(OIDC)で公開するので、API トークンは使わない。
# PyPI 側で、このリポジトリ・このワークフロー(release.yml)・環境 "pypi" を
# Trusted Publisher として登録しておくこと。
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    # プッシュ時の CI とまったく同じ検査。
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the project and the checking tools
        run: python -m pip install -e ".[dev]"
      - name: Build and check the distributions
        # CI と同じ dist の検査に、タグと版の一致を加え、確かめた配布物を dist/ に残す。
        run: python tools/check.py dist --tag "${{ github.event.release.tag_name }}" --dist-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gpframe/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
