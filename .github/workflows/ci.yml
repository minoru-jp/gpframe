# プッシュとプルリクエストのたびに、tools/check.py ですべての検査を走らせる。
# リリース(release.yml)も、このワークフローをそのまま呼んで同じ検査を通す。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the project and the checking tools
        run: python -m pip install -e ".[dev]"
      - name: Run every check
        run: python tools/check.py
